name: Mirror hello-world to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute image names
        id: vars
        shell: bash
        run: |
          echo "source_image=docker.io/library/hello-world:latest" >> "$GITHUB_OUTPUT"
          echo "target_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hello-world:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror multi-arch image to GHCR
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.vars.outputs.target_image }}" \
            "${{ steps.vars.outputs.source_image }}"
