---
- name: Install supportive packages via apt (version > 20)
  when: ansible_facts["distribution_major_version"] | int > 20
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - gnupg
      - python3-pip
    update_cache: yes
  register: apt_result
  retries: 20
  delay: 10
  until: apt_result.rc is not defined
  become: yes

- name: Install supportive packages via apt (version <= 20)
  when: ansible_facts["distribution_major_version"] | int <= 20
  ansible.builtin.shell: apt-get update && apt-get install -y ca-certificates gnupg
  register: apt_result
  changed_when: false


- name: Add Docker’s official repo and GPG key (version > 20)   
  when: ansible_facts["distribution_major_version"] | int > 20
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/ubuntu"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Add Docker’s official repo and GPG key (version <= 20)
  when: ansible_facts["distribution_major_version"] | int <= 20
  block:
    - name: Ensure the keyrings directory exists (version <= 20)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key and set read permissions (version <= 20)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository directly to sources list (version <= 20)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable\n"
        mode: '0644'
      become: true

- name: Install docker engine (version > 20)
  when: ansible_facts["distribution_major_version"] | int > 20
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    update_cache: yes
  register: apt_result
  until: apt_result.rc is not defined
  retries: 20
  delay: 10

- name: Install docker engine (version <= 20)
  when: ansible_facts["distribution_major_version"] | int <= 20
  ansible.builtin.shell: apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io
  changed_when: false

- name: Install pip packages (Ubuntu >= 24)
  when: (ansible_facts["distribution_major_version"] | int >= 24)
  ansible.builtin.apt:
    pkg:
      - python3-docker
  register: apt_pip_result
  until: not apt_pip_result.failed
  retries: 20

- name: Install pip packages (Ubuntu == 22)
  when: ansible_facts["distribution_major_version"] | int == 22
  ansible.builtin.pip:
    name:
      - PyYAML==6.0.3
  register: pip_result
  until: not pip_result.failed
  retries: 20

- name: Install pip packages (Ubuntu <= 20)
  when: ansible_facts["distribution_major_version"] | int <= 20
  ansible.builtin.command: /usr/local/bin/pip3.12 install PyYAML==6.0.3 requests==2.33.1
  changed_when: false
