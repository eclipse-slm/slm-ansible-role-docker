---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  register: prereq_apt_result
  until: not prereq_apt_result.failed
  retries: 20
  delay: 3

- name: Set architecture for Docker apt repository
  ansible.builtin.set_fact:
    docker_debian_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'arm64',
          'armv7l': 'armhf'
        }.get(ansible_facts['architecture'], ansible_facts['architecture'])
      }}     


- name: Add Docker’s official repo and GPG key
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/debian"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_debian_arch }}"
    signed_by: https://download.docker.com/linux/debian/gpg

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-pip
    state: present
    update_cache: true
  register: docker_apt_result
  until: not docker_apt_result.failed
  retries: 20
  delay: 3

- name: Install pip packages (Debian < 12)
  when: ansible_facts['distribution_major_version'] | int < 12
  ansible.builtin.pip:
    name: "packaging"

- name: Install pip packages (Debian >= 12)
  when: ansible_facts['distribution_major_version'] | int >= 12
  ansible.builtin.apt:
    name: "python3-packaging"
    state: present
    update_cache: true
